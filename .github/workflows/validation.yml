name: public source validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Audit authored commits, including the exact PR head and its history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check every source file and reachable commit
        run: python3 tools/release/privacy_guard.py
      - name: Check out the PR merge result
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .ci-merge-source
          persist-credentials: false
      - name: Check every merged source file
        if: github.event_name == 'pull_request'
        working-directory: .ci-merge-source
        # The full history gate above is mandatory; this adds merge-tree coverage.
        run: python3 ../tools/release/privacy_guard.py --working-tree-only
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.14'
      - name: Install CPU dependencies and source
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu.txt
          python -m pip install '.[research,dev]'
      - name: Component smoke and representative regressions
        env:
          EMERGENCE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python -I examples/release/component_smoke.py
          python tools/release/validate_cpu.py
      - name: Build source and wheel
        run: python -m build
      - name: Check whitespace
        run: git diff --check
