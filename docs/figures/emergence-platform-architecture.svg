<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
<title id="title">Emergence reusable research platform architecture</title>
<desc id="description">Source architecture diagram, not a software UI. Research questions become experiment designs. WorldKit and AgentKit feed simulation, with typed contracts, provenance, analysis, and feedback supporting reproducible experiments.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04121e"/><stop offset="1" stop-color="#10283a"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#235e69" stop-opacity=".4"/><stop offset="1" stop-color="#235e69" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0 H0 V44" stroke="#4b8796" stroke-opacity=".08" fill="none"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#64d8db"/></marker>
  <style>
    text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#e5f6fb}
    .title{font-size:66px;font-weight:700;letter-spacing:11px}
    .sub{font-size:23px;fill:#cbdee7}
    .head{font-size:26px;font-weight:700}
    .heading-small{font-size:22px;font-weight:700}
    .tag{font-size:15px;fill:#9feaff;font-weight:600}
    .item{font-size:19px;fill:#cbe3eb}
    .note{font-size:16px;fill:#97bac8}
    .box{fill:#0a263b;stroke:#438dc9;stroke-width:2.4}
    .teal{fill:#092e32;stroke:#52c9ba;stroke-width:2.4}
    .exec{fill:#0a3337;stroke:#65e5de;stroke-width:3}
    .badge{fill:#081d2a;stroke:#3faecd;stroke-width:1.2}
    .links{fill:none;stroke:#64d8db;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bullet{fill:#a9eff0}
  </style>
</defs>
