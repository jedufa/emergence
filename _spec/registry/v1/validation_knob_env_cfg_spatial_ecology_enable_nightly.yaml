harness_api: 1
version: 1
name: validation_knob_env_cfg_spatial_ecology_enable_nightly
description: Per-knob A/B validation for env_cfg.spatial_ecology_enable. Baseline vs variant
  differ only by this knob (or required enabling context).
intent:
  question: Is knob env_cfg.spatial_ecology_enable traceably applied (config + required artifacts)
    in an A/B run pair?
  axes:
  - ab
matrix_order:
- ab
- seed
axes:
  ab:
    values:
    - baseline
    - variant
    flags:
      baseline: []
      variant:
      - --spatial_ecology_enable
seeds:
- 1
- 2
- 3
cli_defaults:
- - --generations
  - '200'
- - --steps
  - '150'
- - --policy_tick_stride
  - '2'
- - --pop
  - '256'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: valknob_nightly
  run_id_format: validation_knob_env_cfg_spatial_ecology_enable_nightly__ab_{ab}__seed{seed:06d}
  run_tag_format: valknob_nightly__ab_{ab}