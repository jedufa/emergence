harness_api: 1
version: 1
name: patch_jungle_v0_campaign_b
description: >
  Patch/Jungle V0 Campaign B short selection probe. This controlled campaign
  runs the standard paired scenario matrix longer than Campaign A to collect
  first-order directional evidence without tuning coefficients or making
  emergence claims.

intent:
  question: "Can Patch/Jungle V0 Campaign B detect first-order directional Patch/Jungle effects while preserving paired-seed comparability?"
  axes:
    - scenario:
        - "s00_flat_baseline"
        - "s01_patch_food_only"
        - "s02_patch_food_terrain"
        - "s03_patch_observed"
        - "s04_patch_waste_crowding"
        - "s05_predator_pressure"
        - "s06_predator_reproduction_emissions"
        - "s07_predator_terrain_protection"
        - "s08_full_jungle_no_recovery"
        - "s09_full_jungle_recovery"

matrix_order: [scenario, seed]

axes:
