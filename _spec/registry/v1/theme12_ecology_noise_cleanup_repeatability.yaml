expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: theme12_ecology_noise_cleanup_repeatability
  run_id_format: '{name}__scenario_{scenario}__seed{seed:06d}'
  run_tag_format: '{run_tag_prefix}__scenario_{scenario}'
