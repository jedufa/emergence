harness_api: 1
version: 1
name: spatial_ecology_tier1
description: >
  Nightly-scale Tier 1 spatial ecology validation. Adds a regrowth Voronoi scenario to
  confirm procedural generators are stable and logged.

intent:
  question: "Are procedural Tier 1 maps (noise/voronoi) deterministic given seeds, and are map artifacts logged for causal attribution?"
  axes:
    - scenario: ["uniform", "spawn_hotspot", "hazard_stripe", "regrowth_voronoi"]

matrix_order: [scenario, seed]

axes:
  scenario:
    values: ["uniform", "spawn_hotspot", "hazard_stripe", "regrowth_voronoi"]
    flags:
      uniform:
        - "--spatial_ecology_enable"
        - "--spatial_ecology_seed"
        - "123"
        - "--spatial_ecology_log_formats"
        - "npy"
        - "--resource_regrowth_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json"
        - "--resource_spawn_density_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json"
        - "--hazard_rate_map_spec"
        - "@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json"
      spawn_hotspot:
        - "--spatial_ecology_enable"
        - "--spatial_ecology_seed"
        - "123"
        - "--spatial_ecology_log_formats"
        - "npy"
        - "--resource_regrowth_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json"
        - "--resource_spawn_density_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__hotspot_center8.json"
        - "--hazard_rate_map_spec"
        - "@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json"
      hazard_stripe:
        - "--spatial_ecology_enable"
        - "--spatial_ecology_seed"
        - "123"
        - "--spatial_ecology_log_formats"
        - "npy"
        - "--resource_regrowth_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json"
        - "--resource_spawn_density_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json"
        - "--hazard_rate_map_spec"
        - "@experiments/assets/spatial_ecology/v1/hazard_rate_map__left_high_right_low.json"
      regrowth_voronoi:
        - "--spatial_ecology_enable"
        - "--spatial_ecology_seed"
        - "123"
        - "--spatial_ecology_log_formats"
        - "npy"
        - "--resource_regrowth_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_regrowth_map__voronoi10.json"
        - "--resource_spawn_density_map_spec"
        - "@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json"
        - "--hazard_rate_map_spec"
        - "@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json"

seeds: [42, 43, 44]

cli_defaults:
  - ["--generations", "20"]
  - ["--steps", "150"]
  - ["--pop", "256"]
  - ["--policy_tick_stride", "2"]

expected_artifacts:
  - "manifest.json"
  - "run_config.csv"
  - "config.json"
  - "metrics.csv"
  - "maps/spec.json"
  - "maps/summary.json"
  - "maps/maps_readme.md"
  - "maps/resource_regrowth_map.npy"
  - "maps/resource_spawn_density_map.npy"
  - "maps/hazard_rate_map.npy"

naming:
  run_tag_prefix: "spat1_nightly"
  run_id_format: "{name}__scenario_{scenario}__seed{seed:06d}"
  run_tag_format: "{run_tag_prefix}__scenario_{scenario}"
