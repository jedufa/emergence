harness_api: 1
version: 1
name: lbc1_lineage_bottleneck_closure_source
description: "LBC-1 checkpoint-enabled source campaign for Phase II lineage bottleneck closure."
intent:
  question: "Is early lineage collapse acceptable as a V0 limitation, or does it require one targeted fix before CRB-1?"
  axes:
    - scenario:
        - lbc1_00_tuned_full_jungle_recovery
        - lbc1_01_default_full_jungle
        - lbc1_02_theme12_clean_pressure_reference
matrix_order:
  - scenario
  - seed
axes:
  scenario:
    values:
      - lbc1_00_tuned_full_jungle_recovery
      - lbc1_01_default_full_jungle
      - lbc1_02_theme12_clean_pressure_reference
    flags:
      lbc1_00_tuned_full_jungle_recovery:
        - --knob
        - env_cfg.patch_world_enable=true
        - --knob
        - env_cfg.patch_world_observation_enable=true
        - --knob
        - env_cfg.patch_world_waste_consequence_enable=true
        - --knob
        - env_cfg.jungle_predator_pressure_enable=true
