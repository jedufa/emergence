harness_api: 1
version: 1
name: chaos_week_2_smoke
description: 'Chaos Week 2 (smoke): sanity checks for pressure topology mapping. 1
  seed, short horizon. A/B pairs plus one ablation.'
intent:
  question: Pressure topology mapping for Chaos Week 2 (identity coupling, late-life
    pressure, developmental lock-in).
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - smoke_A1_identity_gate_soft_action_noise__baseline
    - smoke_A1_identity_gate_soft_action_noise__variant
    - smoke_A1_identity_gate_soft_action_noise_ablation__baseline
    - smoke_A1_identity_gate_soft_action_noise_ablation__variant
    - smoke_B1_late_life_hazard_mild__baseline
    - smoke_B1_late_life_hazard_mild__variant
    - smoke_C1_plasticity_decay_soft__baseline
    - smoke_C1_plasticity_decay_soft__variant
    - smoke_helper_stride4_temp__baseline
    - smoke_helper_stride4_temp__variant
    flags:
      smoke_A1_identity_gate_soft_action_noise__baseline: []
      smoke_A1_identity_gate_soft_action_noise__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=action_noise
      - --knob
      - sim_cfg.identity_gate_strength=0.5
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      smoke_A1_identity_gate_soft_action_noise_ablation__baseline: []
      smoke_A1_identity_gate_soft_action_noise_ablation__variant:
      - --knob
      - sim_cfg.identity_gate_enable=false
      - --knob
      - sim_cfg.identity_gate_mode=action_noise
      - --knob
      - sim_cfg.identity_gate_strength=0.5
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      smoke_B1_late_life_hazard_mild__baseline: []
      smoke_B1_late_life_hazard_mild__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=hazard
      - --knob
      - sim_cfg.late_life_pressure_weight=0.5
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      smoke_C1_plasticity_decay_soft__baseline: []
      smoke_C1_plasticity_decay_soft__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=true
      - --knob
      - sim_cfg.dev_plasticity_decay_enable=true
      - --knob
      - sim_cfg.dev_plasticity_half_life_steps=60
      smoke_helper_stride4_temp__baseline: []
      smoke_helper_stride4_temp__variant:
      - --knob
      - sim_cfg.policy_tick_stride=4
      - --knob
      - genome.action_temperature=1.10
seeds:
- 1
cli_defaults:
- - --generations
  - '80'
- - --steps
  - '150'
- - --pop
  - '256'
- - --policy_tick_stride
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
- behaviors.csv
naming:
  run_tag_prefix: chaos_week2_smoke
  run_id_format: chaos_week_2_smoke__{case}__seed{seed:06d}
  run_tag_format: chaos_week2_smoke__{case}
