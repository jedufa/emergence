expected_artifacts:
  - manifest.json
  - run_config.csv
  - config.json
  - metrics.csv
  - prediction_demand_action_context/prediction_demand_action_context_schema.json
  - prediction_demand_action_context/prediction_demand_action_context_generation_summary.jsonl
  - prediction_demand_action_context/prediction_demand_action_context_run_summary.json
  - prediction_demand_action_context/prediction_demand_action_context_sign_summary.json
  - prediction_demand_action_context/prediction_demand_action_context_sign_window_summary.jsonl
  - prediction_demand_action_context/prediction_demand_action_context_sign_generation_summary.jsonl
naming:
  run_tag_prefix: prediction_resource_wave_sign_reporting_recheck_DRAFT
  run_id_format: "prediction_resource_wave_sign_recheck_DRAFT__pred_{prediction_condition}__demand_{demand_context}__init_{init_arm}__variant_{substrate_variant}__seed{seed:06d}"
  run_tag_format: "prediction_resource_wave_sign_recheck_DRAFT__pred_{prediction_condition}__demand_{demand_context}__init_{init_arm}__variant_{substrate_variant}"
preflight_required:
  - dry_run_matrix
  - tiny_prediction_demand_enabled_metrics_nonzero
  - c6_sign_summary_reporting_fixture
