  - - --knob
    - sim_cfg.enable_cognitive_budget_ledger=true
  - - --knob
    - sim_cfg.enable_evolvable_sensor_channel_mask=true
  - - --knob
    - sim_cfg.enable_evolvable_sensor_radius=false
  - - --knob
    - sim_cfg.force_default_sensor_radius=true
  - - --knob
    - sim_cfg.force_memory_disabled=false
  - - --knob
    - sim_cfg.reset_memory_each_tick=false
  - - --knob
    - sim_cfg.memory_pressure_scenario=false
  - - --knob
    - sim_cfg.enable_experimental_prediction_cost_charging=true
  - - --knob
    - sim_cfg.prediction_cost_base=0.0005
  - - --knob
    - sim_cfg.prediction_cost_per_lr=0.001
  - - --knob
    - sim_cfg.prediction_state_cost=0.0001
  - - --knob
    - sim_cfg.disable_prediction_error_selection_pressure=true
  - - --knob
    - sim_cfg.episode0_fitness_weight=0.0
  - - --knob
    - sim_cfg.episode0_pred_err_fitness_weight=0.0
  - - --knob
    - sim_cfg.episode0_thrashing_fitness_weight=0.0
  - - --knob
    - sim_cfg.episode0_drive_jitter_fitness_weight=0.0
  - - --knob
    - sim_cfg.episode0_selfharm_fitness_weight=0.0
  - - --knob
    - sim_cfg.late_pred_cost_enable=false
  - - --knob
    - sim_cfg.late_coherence_eff_enable=false
  - - --knob
    - sim_cfg.adult_move_penalty_enable=false
  - - --knob
    - sim_cfg.identity_drift_enable=false
  - - --knob
    - sim_cfg.prediction_demand_action_context_enable=true
  - - --knob
    - sim_cfg.prediction_demand_action_context_write_events=false
  - - --knob
    - sim_cfg.prediction_demand_action_context_window_radius=1
  - - --knob
    - sim_cfg.prediction_demand_action_context_include_lineage=true
  - - --knob
    - sim_cfg.prediction_demand_action_context_sign_summary_enable=true
  - - --knob
    - sim_cfg.prediction_demand_action_context_sign_summary_include_windows=true
  - - --knob
