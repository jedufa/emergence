harness_api: 1
version: 1
name: impact090_tier1_tier2
description: ">-\n  Quick-scale Phase II (ecological consequences) for Tier 1 + Tier\
  \ 2.\n  Confirms gradients change occupancy/survival/reproduction spatially (no\
  \ global collapse, no perverse direction).\n"
intent:
  question: Do Tier 1 and Tier 2 gradients change ecological outcomes in a spatially
    interpretable way (movement/survival/repro) without agent steering?
  axes:
  - condition:
    - II1_T1_uniform__T2_none
    - II1_T1_med__T2_none
    - II2_T1_uniform__T2_none
    - II2_T1_uniform__T2_singleNW
    - II3_T1_uniform__T2_early
    - II3_T1_uniform__T2_late
    - II4_T1_med__T2_hits_refuge
    - II4_T1_med__T2_spares_refuge
matrix_order:
- condition
- seed
