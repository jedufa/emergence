        - sim_cfg.force_memory_disabled=false
        - --knob
        - sim_cfg.reset_memory_each_tick=false
        - --knob
        - sim_cfg.force_prediction_zero_lr=true
        - --knob
        - sim_cfg.reset_prediction_each_tick=true
