harness_api: 1
version: 1
name: validation_2x2_devcoupling_latecoh
description: >
  Smoke-scale 2×2 validation grid: dev-coupling off/on × late-life coherence pressure off/on.
  Designed to be fast and safe for nox smoke-like execution.

intent:
  question: "Does late-life coherence pressure shift selection, and does dev-coupling change the effect?"
  axes:
    - dev_coupling: ["False", "True"]
    - late_life_coh_cost: ["False", "True"]

# Deterministic expansion order.
matrix_order: [dev_coupling, late_life_coh_cost, seed]

axes:
  dev_coupling:
    values: ["False", "True"]
    flags:
      "False": []
      "True": ["--devcoupling_enable"]
  late_life_coh_cost:
    values: ["False", "True"]
    flags:
      "False": []
      "True": ["--late_pred_cost_enable", "--late_pred_cost_weight", "0.01"]

seeds: [42]

# Explicit mapping: defaults -> CLI flags.
cli_defaults:
  - ["--generations", "10"]
  - ["--steps", "150"]
  - ["--pop", "256"]
  - ["--policy_tick_stride", "2"]

# Minimal correctness checks: these must exist inside each run directory.
# manifest.json is mandatory in this project.
expected_artifacts:
  - "manifest.json"
  - "run_config.csv"
  - "config.json"
  - "metrics.csv"

naming:
  run_tag_prefix: "val2x2_smoke"
  run_id_format: "{name}__dc_{dev_coupling}__lc_{late_life_coh_cost}__seed{seed:06d}"
  run_tag_format: "{run_tag_prefix}__dc_{dev_coupling}__lc_{late_life_coh_cost}"
