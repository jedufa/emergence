harness_api: 1
version: 1
name: mem_max_8_live_delayed_choice_tiny_calibration
description: MEM-MAX-8 compact live delayed-choice technical calibration registry.
intent:
  question: Can the default-off mem_max_delayed_choice_v1 substrate run in the live engine with reportable controls?
  note: >
    Tiny technical matrix only. Positive interpretation still requires the
    MEM-MAX seven-gate contract; this registry must not be used as broad memory
    selection evidence.
  planned_runs: 10
matrix_order:
- memory_arm
- demand_cell
- seed
axes:
  memory_arm:
    values:
    - memory_normal
    - memory_ablated
    flags:
      memory_normal:
      - --knob
      - sim_cfg.force_memory_disabled=false
      - --knob
      - sim_cfg.reset_memory_each_tick=false
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=mem_max_8_live_delayed_choice_calibration
      memory_ablated:
      - --knob
      - sim_cfg.force_memory_disabled=true
      - --knob
      - sim_cfg.reset_memory_each_tick=true
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=mem_max_8_live_delayed_choice_calibration
  demand_cell:
    values:
    - flat_control_clean
    - delayed_choice_useful
    - delayed_choice_cue_off
    - delayed_choice_consequence_off
    - delayed_choice_shortcut_control
    flags:
      flat_control_clean:
      - --knob
      - env_cfg.mem_max_delayed_choice_enable=false
      - --knob
      - env_cfg.mem_max_delayed_choice_observation_enable=false
      delayed_choice_useful:
      - --knob
      - env_cfg.mem_max_delayed_choice_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_observation_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_cue_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_consequence_enable=true
      delayed_choice_cue_off:
      - --knob
      - env_cfg.mem_max_delayed_choice_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_observation_enable=false
      - --knob
      - env_cfg.mem_max_delayed_choice_cue_enable=false
      - --knob
      - env_cfg.mem_max_delayed_choice_consequence_enable=true
      delayed_choice_consequence_off:
      - --knob
      - env_cfg.mem_max_delayed_choice_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_observation_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_cue_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_consequence_enable=false
      delayed_choice_shortcut_control:
      - --knob
      - env_cfg.mem_max_delayed_choice_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_observation_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_cue_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_consequence_enable=true
      - --knob
      - env_cfg.mem_max_delayed_choice_shortcut_truth_enable=true
seeds:
- 101
cli_defaults:
- - --generations
  - "1"
- - --steps
  - "8"
- - --pop
  - "8"
- - --grid_size
  - "7"
- - --device
  - cpu
- - --bank_device
  - cpu
- - --knob
  - env_cfg.patch_world_enable=true
- - --knob
  - env_cfg.patch_world_observation_enable=true
- - --knob
  - env_cfg.enable_biomes=false
- - --knob
  - env_cfg.food_spawn_per_step=0
- - --knob
  - env_cfg.max_food=0
- - --knob
  - env_cfg.patch_food_amount_initial_empty_cell_value=1.0
- - --knob
  - env_cfg.patch_food_regrow_per_step=0.0
- - --knob
  - env_cfg.patch_waste_consume_emit=0.0
- - --knob
  - env_cfg.patch_waste_presence_emit=0.0
- - --knob
  - env_cfg.patch_waste_decay_per_step=0.0
- - --knob
  - env_cfg.mem_max_delayed_choice_schema_version=1
- - --knob
  - env_cfg.mem_max_delayed_choice_cue_steps=1
- - --knob
  - env_cfg.mem_max_delayed_choice_hidden_steps=2
- - --knob
  - env_cfg.mem_max_delayed_choice_active_steps=2
- - --knob
  - env_cfg.mem_max_delayed_choice_event_period_steps=10
- - --knob
  - env_cfg.mem_max_delayed_choice_target_geometry=horizontal_symmetric
- - --knob
  - env_cfg.mem_max_delayed_choice_target_distance=2
- - --knob
  - env_cfg.mem_max_delayed_choice_damage=0.25
- - --knob
  - sim_cfg.enable_experimental_memory_cost_charging=true
- - --knob
  - sim_cfg.enable_cognitive_status_metrics=true
- - --knob
  - sim_cfg.lineage_founder_balance_enable=true
- - --knob
  - sim_cfg.lineage_founder_group_count=4
- - --knob
  - sim_cfg.lineage_founder_min_agents_per_group=2
- - --knob
  - sim_cfg.policy_deterministic_actions=true
- - --knob
  - sim_cfg.checkpoint_bundle_v2_period_gen=0
- - --knob
  - sim_cfg.lineage_qd_archive_enable=false
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: mem_max_8_live_delayed_choice_tiny_calibration
  run_id_format: mem_max_8__memory_{memory_arm}__demand_{demand_cell}__seed{seed:06d}
  run_tag_format: mem_max_8__memory_{memory_arm}__demand_{demand_cell}
mem_max_8_status:
  schema_version: mem_max_8_registry_status_v1
  status: live_substrate_technical_registry
  caution: no broad memory-selection interpretation without seven-gate pass
