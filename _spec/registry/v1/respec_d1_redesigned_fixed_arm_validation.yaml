naming:
  run_id_format: "{name}__world_{world_family}__arm_{fixed_arm}__seed{seed:06d}"
  run_tag_prefix: respec_d1_redesigned_fixed_arm_validation
  run_tag_format: "{run_tag_prefix}__world_{world_family}__arm_{fixed_arm}__seed{seed:06d}"
expected_artifacts:
- manifest.json
- run_config.csv
- metrics.csv
- branch_observability/branch_observability_agent_lifecycle.jsonl
- branch_observability/branch_observability_birth_edges.jsonl
- branch_observability/branch_observability_niche_lifecycle.jsonl
respec1_contract:
  fixed_arm_axis_values:
    a_favored: 0.75
    neutral: 0.0
    b_favored: -0.75
  planned_world_families:
  - flat
  - reporting_only
  - a_only
  - b_only
  - equalized_sham
  - mixed_tradeoff
  no_direct_reward: true
  no_lineage_or_branch_rescue: true
  no_evolving_axis_arm: true
  fixed_arm_freeze_mechanism: founder genome.resource_handling_axis override plus genome.mutation_rate=0.0.
  observation_decision: Existing Patch World food observations and learned experience are sufficient for fixed-arm demand validation; no explicit A/B identity channel is claimed for future evolving-axis selection.
  planned_cells: 72
