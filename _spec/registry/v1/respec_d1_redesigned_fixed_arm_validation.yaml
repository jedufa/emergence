- - --knob
  - sim_cfg.campaign_output_profile=compact_default
- - --knob
  - sim_cfg.checkpoint_bundle_v2_period_gen=0
- - --knob
  - sim_cfg.lineage_qd_archive_enable=false
- - --knob
  - sim_cfg.lineage_founder_balance_enable=false
- - --knob
  - sim_cfg.lro1_reproductive_opportunity_enable=false
- - --knob
  - sim_cfg.lro4_offspring_dispersal_enable=false
- - --knob
  - sim_cfg.pressure_autopilot_enable=false
- - --knob
  - sim_cfg.pressure_autopilot_hold=true
- - --knob
  - sim_cfg.pressure_autopilot_suggestion_only=true
- - --knob
  - sim_cfg.branch_observability_enable=true
- - --knob
  - sim_cfg.branch_observability_birth_edges_enable=true
- - --knob
  - sim_cfg.branch_observability_lifecycle_enable=true
- - --knob
  - sim_cfg.branch_observability_descriptor_snapshot_enable=true
- - --knob
  - sim_cfg.branch_niche_observability_enable=true
- - --knob
  - sim_cfg.branch_niche_lifecycle_enable=true
- - --knob
  - sim_cfg.branch_niche_strategy_compression_enable=true
- - --knob
  - sim_cfg.branch_niche_output_profile=compact_v1
- - --knob
  - sim_cfg.lineage_collapse_forensics_enable=true
- - --knob
  - sim_cfg.lineage_collapse_forensics_schema_version=1
- - --knob
  - sim_cfg.lineage_reproduction_funnel_reporting_enable=true
- - --knob
  - sim_cfg.lineage_reproduction_funnel_schema_version=1
- - --knob
  - sim_cfg.lineage_reproduction_funnel_write_per_generation=true
- - --knob
