harness_api: 1
version: 1
name: respec_d1_redesigned_fixed_arm_validation
description: RESPEC-D1 measurement-contract fixed-arm world-pressure validation; no mechanics redesign.
intent:
  question: Can a fixed resource-handling arm matrix isolate Resource A/B world pressure from flat, reporting-only, single-resource, and equalized-sham alternatives before any selection campaign is authorized?
  safe_claim_boundary: Registry design and dry-run readiness only; no intelligence, emergence, cognition, adaptive-memory, prediction-selection, solved lineage-diversity, or open-endedness claim.
  task_decision_target: RESPEC-1-A
matrix_order:
- world_family
- fixed_arm
- seed
flag_templates:
  flat_world: &flat_world
  - --knob
  - env_cfg.patch_world_enable=false
  - --knob
  - env_cfg.patch_world_observation_enable=false
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=false
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  reporting_only_world: &reporting_only_world
  - --knob
  - env_cfg.patch_world_enable=true
  - --knob
  - env_cfg.patch_world_observation_enable=true
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=false
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  a_only_world: &a_only_world
  - --knob
  - env_cfg.patch_world_enable=true
  - --knob
  - env_cfg.patch_world_observation_enable=true
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=true
  - --knob
  - env_cfg.respec0b_resource_class_mode=all_a
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  b_only_world: &b_only_world
  - --knob
  - env_cfg.patch_world_enable=true
  - --knob
  - env_cfg.patch_world_observation_enable=true
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=true
  - --knob
  - env_cfg.respec0b_resource_class_mode=all_b
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  equalized_sham_world: &equalized_sham_world
  - --knob
  - env_cfg.patch_world_enable=true
  - --knob
  - env_cfg.patch_world_observation_enable=true
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=true
  - --knob
  - env_cfg.respec0b_resource_class_mode=vertical_split_ab
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=true
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  mixed_tradeoff_world: &mixed_tradeoff_world
  - --knob
  - env_cfg.patch_world_enable=true
  - --knob
  - env_cfg.patch_world_observation_enable=true
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=true
  - --knob
  - env_cfg.respec0b_resource_class_mode=vertical_split_ab
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
  fixed_a_favored: &fixed_a_favored
  - --knob
  - sim_cfg.resource_handling_representation_enable=true
  - --knob
  - sim_cfg.resource_handling_representation_reporting_enable=true
  - --knob
  - genome.resource_handling_axis=0.75
  - --knob
  - genome.mutation_rate=0.0
  fixed_neutral: &fixed_neutral
  - --knob
  - sim_cfg.resource_handling_representation_enable=true
  - --knob
  - sim_cfg.resource_handling_representation_reporting_enable=true
  - --knob
  - genome.resource_handling_axis=0.0
  - --knob
  - genome.mutation_rate=0.0
  fixed_b_favored: &fixed_b_favored
  - --knob
  - sim_cfg.resource_handling_representation_enable=true
  - --knob
  - sim_cfg.resource_handling_representation_reporting_enable=true
  - --knob
  - genome.resource_handling_axis=-0.75
  - --knob
  - genome.mutation_rate=0.0
axes:
  world_family:
    values:
    - flat
    - reporting_only
    - a_only
    - b_only
    - equalized_sham
    - mixed_tradeoff
    flags:
      flat: *flat_world
      reporting_only: *reporting_only_world
      a_only: *a_only_world
      b_only: *b_only_world
      equalized_sham: *equalized_sham_world
      mixed_tradeoff: *mixed_tradeoff_world
  fixed_arm:
    values:
    - a_favored
    - neutral
    - b_favored
    flags:
      a_favored: *fixed_a_favored
      neutral: *fixed_neutral
      b_favored: *fixed_b_favored
seeds:
- 101
- 202
- 303
- 404
