- - --knob
  - sim_cfg.lineage_reproduction_funnel_event_output_profile=path2_roz_summary_only_v1
- - --knob
  - sim_cfg.lineage_reproduction_funnel_incremental_summary_cache_enable=true
- - --knob
  - sim_cfg.lineage_reproduction_funnel_include_patch_context=true
- - --knob
