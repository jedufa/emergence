harness_api: 1
version: 1
name: migration_pressure_tier3
description: >
  Smoke-scale Tier 3 migration pressure wiring test (registry-driven).
  Validates that movement cost + border crossings + Tier3 region logs appear,
  using validation-only forced random walk (plumbing, not evolution).

intent:
  question: "Tier 3 wiring: do movement costs and region crossings produce non-zero logged signals?"
  axes:
    - scenario: ["baseline", "variant"]

matrix_order: [scenario, seed]

axes:
  scenario:
    values: ["baseline", "variant"]
    flags:
      baseline:
        # Baseline keeps Tier 3 pressures disabled, but uses the same region
        # partition as the variant so region artifacts exist for A/B comparison.
        - "--tier3_regions_spec"
        - "@experiments/assets/tier3_migration/v1/tier3_regions_2x2.json"
      variant:
        - "--migration_pressure_enable"
        - "--tier3_regions_spec"
        - "@experiments/assets/tier3_migration/v1/tier3_regions_2x2.json"
        - "--tier3_movement_cost_map"
        - "@experiments/assets/tier3_migration/v1/tier3_move_cost_2x2.json"
        - "--tier3_region_transition_risk"
        - "@experiments/assets/tier3_migration/v1/tier3_transition_risk_2x2.json"
        - "--tier3_validation_force_random_walk"

seeds: [42]

cli_defaults:
  - ["--generations", "1"]
  - ["--steps", "80"]
  - ["--pop", "64"]
  - ["--policy_tick_stride", "1"]

expected_artifacts:
  - "manifest.json"
  - "run_config.csv"
  - "config.json"
  - "metrics.csv"
  - "maps/tier3_region_id.npy"
  - "maps/tier3_regions_stats.json"

naming:
  run_tag_prefix: "tier3_smoke"
  run_id_format: "{name}__scenario_{scenario}__seed{seed:06d}"
  run_tag_format: "{run_tag_prefix}__scenario_{scenario}"
