harness_api: 1
version: 1
name: validation_family_reward_shaping
description: Quick family validation for reward shaping (aggregated per knob).
intent:
  question: Are knobs in family 'reward_shaping' traceably applied, and do they produce
    a detectable signal?
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - genome_reward_shaping_enable__baseline
    - genome_reward_shaping_enable__variant
    - genome_reward_shaping_enable__baseline
    - genome_reward_shaping_enable__variant
    flags:
      genome_reward_shaping_enable__baseline: []
      genome_reward_shaping_enable__variant:
      - --knob
      - genome.reward_shaping_enable=true
seeds:
- 1
- 2
cli_defaults:
- - --generations
  - '8'
- - --steps
  - '120'
- - --pop
  - '128'
- - --policy_tick_stride
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: val_family_quick
  run_id_format: '{name}__{case}__seed{seed:06d}'
  run_tag_format: '{run_tag_prefix}__{case}'
