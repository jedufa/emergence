harness_api: 1
version: 1
uid: 20k_autopilot
name: 20k_autopilot
description: First harness test generated by web interface
intent:
  question: does harness test generated by web interface work?
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - forbidden_scalar_late_pred_cost__baseline
    flags:
      forbidden_scalar_late_pred_cost__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
seeds:
- 1
cli_defaults:
- - --generations
  - '2'
- - --steps
  - '150'
- - --pop
  - '128'
- - --policy_tick_stride
  - '2'
- - --grid_size
  - '32'
- - --checkpoint_period_gen
  - '500'
- - --checkpoint_rotate
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: 20k_autopilot
  run_id_format: r__{case}__s{seed:06d}
  run_tag_format: '{run_tag_prefix}__{case}'
