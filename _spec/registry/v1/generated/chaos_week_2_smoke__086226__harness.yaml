harness_api: 1
version: 1
uid: chaos_week_2_smoke
name: chaos_week_2_smoke
description: 'Chaos Week 2 (smoke): sanity checks for pressure topology mapping. 1
  seed, short horizon. A/B pairs plus one ablation.'
intent:
  question: Pressure topology mapping for Chaos Week 2 (identity coupling, late-life
    pressure, developmental lock-in).
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - smoke_A1_identity_gate_soft_action_noise__baseline
    flags:
      smoke_A1_identity_gate_soft_action_noise__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
seeds:
- 1
cli_defaults:
- - --generations
  - '80'
- - --steps
  - '150'
- - --pop
  - '256'
- - --policy_tick_stride
  - '2'
- - --grid_size
  - '32'
- - --checkpoint_period_gen
  - '500'
- - --checkpoint_rotate
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
- behaviors.csv
naming:
  run_tag_prefix: chaos_week_2_smoke
  run_id_format: '{run_tag_prefix}__{case}__seed{seed:06d}'
  run_tag_format: '{run_tag_prefix}__{case}'
