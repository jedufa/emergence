axes:
  world_family:
    values:
    - flat
    - reporting_only
    - a_only
    - b_only
    - equalized_sham
    - mixed_tradeoff
    - capacity_balanced_mixed
    flags:
      flat: *flat_world
      reporting_only: *reporting_only_world
      a_only: *a_only_world
      b_only: *b_only_world
      equalized_sham: *equalized_sham_world
      mixed_tradeoff: *mixed_tradeoff_world
      capacity_balanced_mixed: *capacity_balanced_mixed_world
  fixed_arm:
    values:
    - a_favored
    - neutral
    - b_favored
    flags:
      a_favored: *fixed_a_favored
      neutral: *fixed_neutral
      b_favored: *fixed_b_favored
seeds:
- 101
- 202
- 303
- 404
