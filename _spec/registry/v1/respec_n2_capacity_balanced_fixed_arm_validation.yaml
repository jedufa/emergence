- manifest.json
- run_config.csv
- metrics.csv
- metrics/respec_n1_zone_generation_summary.csv
- metrics/respec_n1_zone_run_summary.json
- branch_observability/branch_observability_agent_lifecycle.jsonl
- branch_observability/branch_observability_birth_edges.jsonl
- branch_observability/branch_observability_niche_lifecycle.jsonl
respec_n2_contract:
  formula_version: energy_return_regrowth_balance_v1
  resource_a_return: 0.75
  resource_b_return: 1.5
  resource_a_fertility: 1.0
  resource_b_fertility: 0.5
  resource_a_energy_regrowth_budget_per_cell: 0.75
  resource_b_energy_regrowth_budget_per_cell: 0.75
  selected_cells: 38
  no_direct_reward: true
  no_lineage_or_branch_rescue: true
  no_evolving_axis_arm: true
  fixed_arm_freeze_mechanism: founder genome.resource_handling_axis override plus genome.mutation_rate=0.0.
  anti_treadmill: one analytic formula, one frozen parameter set, one rehearsal, one bounded fixed-arm validation, one repeat parity, one final decision.
