harness_api: 1
version: 1
name: respec_n2_capacity_balanced_fixed_arm_validation
description: RESPEC-N2 capacity-balanced mixed resource niche validation; analytic fertility balance frozen before execution.
intent:
  question: Does one genotype-blind capacity-balanced mixed resource world produce cleaner reciprocal fixed-arm local ecological pressure than the prior mixed tradeoff while controls stay clean?
  safe_claim_boundary: Fixed-arm world-pressure substrate validation only; no intelligence, emergence, cognition, adaptive-memory, prediction-selection, solved lineage-diversity, or open-endedness claim.
  task_decision_target: RESPEC-N2-A/B/C/D/E
matrix_order:
- world_family
- fixed_arm
- seed
flag_templates:
  flat_world: &flat_world
  - --knob
  - env_cfg.patch_world_enable=false
  - --knob
  - env_cfg.patch_world_observation_enable=false
  - --knob
  - env_cfg.respec0b_resource_specialization_enable=false
  - --knob
  - env_cfg.respec0b_resource_equalized_sham_enable=false
  - --knob
  - env_cfg.respec_n2_capacity_balanced_mixed_enable=false
  - --knob
  - sim_cfg.branch_niche_observability_enable=true
