harness_api: 1
version: 1
name: impact090_tier1_tier2
description: ">-\n  Nightly-scale Phase III (evolutionary pressure) for Tier 1 + Tier\
  \ 2.\n  Tests whether repeated, predeclared drought exposure shifts population-level\
  \ distributions/metrics across generations.\n"
intent:
  question: Do repeated Tier 2 exposures (with Tier 1 background) shift population-level
    metrics across generations in a consistent, directional way?
  axes:
  - condition:
    - III1_T1_uniform__T2_none
    - III1_T1_uniform__T2_repeatedNW_severe
    - III2_T1_med__T2_none
    - III2_T1_med__T2_repeatedNW_severe
    - III3_T1_uniform__T2_repeatedNW_mild
    - III3_T1_uniform__T2_repeatedNW_moderate
    - III3_T1_uniform__T2_repeatedNW_severe
    - III4_T1_med__T2_repeated_hits_refuge
    - III4_T1_med__T2_repeated_spares_refuge
matrix_order:
- condition
- seed
