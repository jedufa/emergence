harness_api: 1
version: 1
name: mem_evo_3_tiny_memory_selection_shift
description: Tiny MEM-EVO-3 memory-capacity selection-shift gate under flat and WDL delayed-hazard contexts.
intent:
  question: Does WDL delayed-hazard demand shift genome-level memory_dim in selected parents and descendants more than flat controls?
  note: Tiny selection-shift gate only; no intelligence, emergence, broad adaptive memory, prediction-selection, or MEM-EVO-A claims.
matrix_order:
- memory_arm
- world_context
- seed
axes:
  memory_arm:
    values:
    - memory_normal
    - memory_ablated
    flags:
      memory_normal:
      - --knob
      - sim_cfg.force_memory_disabled=false
      - --knob
      - sim_cfg.reset_memory_each_tick=false
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=mem_evo_3_tiny_selection_shift
      memory_ablated:
      - --knob
      - sim_cfg.force_memory_disabled=true
      - --knob
      - sim_cfg.reset_memory_each_tick=true
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=mem_evo_3_tiny_selection_shift
  world_context:
    values:
    - flat_control_clean
    - wdl_delayed_hazard
    flags:
      flat_control_clean:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=true
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=true
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=true
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_scale=0.35
      - --knob
      - env_cfg.patch_density_regrowth_penalty_scale=0.35
      - --knob
      - env_cfg.jungle_predator_risk_cap=0.045
      - --knob
      - env_cfg.jungle_predator_health_damage=0.22
      - --knob
      - env_cfg.jungle_recovery_regrowth_boost_scale=0.08
      - --knob
      - env_cfg.lineage_diversity_reporting_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_enable=false
      - --knob
      - env_cfg.wdl_delayed_hazard_observation_enable=false
      wdl_delayed_hazard:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=true
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=true
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=true
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_scale=0.35
      - --knob
      - env_cfg.patch_density_regrowth_penalty_scale=0.35
      - --knob
      - env_cfg.jungle_predator_risk_cap=0.045
      - --knob
      - env_cfg.jungle_predator_health_damage=0.22
      - --knob
      - env_cfg.jungle_recovery_regrowth_boost_scale=0.08
      - --knob
      - env_cfg.lineage_diversity_reporting_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_observation_enable=true
seeds:
- 101
- 202
