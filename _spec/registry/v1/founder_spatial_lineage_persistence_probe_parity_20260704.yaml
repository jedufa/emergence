      - sim_cfg.lineage_founder_spatial_assignment_mode=grid_quadrants
      - --knob
      - sim_cfg.lineage_founder_spatial_use_patch_basins=true
      - --knob
      - sim_cfg.lineage_founder_spatial_schema_version=1
  repeat:
    values:
    - a
    - b
    flags:
      a: []
      b: []
