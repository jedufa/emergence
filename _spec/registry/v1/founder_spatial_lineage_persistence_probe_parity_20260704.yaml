harness_api: 1
version: 1
name: founder_spatial_lineage_persistence_probe_parity_20260704
description: Founder spatial separation lineage persistence probe.
intent:
  question: Does default-off founder spatial/ecological separation improve live lineage
    persistence and reduce founder collision?
  safe_claim_boundary: Initialization-only diagnostic; no lineage protection, rescue,
    reseeding, rewards, cognition, intelligence, or emergence claim.
matrix_order:
- context
- init_arm
- repeat
- seed
