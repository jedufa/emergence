harness_api: 1
version: 1
name: validation_family_env_logging
description: Smoke family validation for env logging (aggregated per knob).
intent:
  question: Is env_cfg.spatial_ecology_log_stats traceably applied and does it produce expected logging artifacts?
  axes:
    - case

matrix_order:
  - case
  - seed

axes:
  case:
    values:
      - env_cfg_spatial_ecology_log_stats__baseline
      - env_cfg_spatial_ecology_log_stats__variant
    flags:
      env_cfg_spatial_ecology_log_stats__baseline:
        - --knob
        - env_cfg.spatial_ecology_log_stats=false
      env_cfg_spatial_ecology_log_stats__variant:
        - --knob
        - env_cfg.spatial_ecology_log_stats=true

seeds:
  - 42

cli_defaults:
  - ["--gen", "2"]
  - ["--steps", "30"]

expected_artifacts:
  - "manifest.json"
  - "metrics.csv"

naming:
  run_tag_prefix: "validation_family_env_logging_smoke"
  run_id_format: "validation_family_env_logging__{case}__seed{seed:06d}"
  run_tag_format: "val_family_smoke__{case}"
