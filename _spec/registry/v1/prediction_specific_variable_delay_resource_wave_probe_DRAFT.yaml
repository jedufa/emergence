  - prediction_demand_action_context/prediction_demand_action_context_run_summary.json
naming:
  run_tag_prefix: prediction_specific_variable_delay_resource_wave_probe_DRAFT
  run_id_format: "prediction_specific_vdrw_probe__pred_{prediction_condition}__demand_{demand_context}__init_{init_arm}__variant_{substrate_variant}__seed{seed:06d}"
  run_tag_format: "prediction_specific_vdrw_probe__pred_{prediction_condition}__demand_{demand_context}__init_{init_arm}__variant_{substrate_variant}"
preflight_required:
  - dry_run_matrix
  - tiny_prediction_demand_enabled_metrics_nonzero
  - tiny_prediction_demand_disabled_metrics_zero
  - tiny_action_context_windows_emit
  - prediction_normal_vs_ablated_config_diff_only_intended_controls
  - reward_audit_zero
  - observation_gates_correct
  - checkpoint_replay_stable
  - no_memory_campaign_arms
