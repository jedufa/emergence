harness_api: 1
version: 1
name: integrated_r1_baseline_reproduction
description: "R1 integrated baseline reproduction after Theme 1/2, Theme 4, Theme 5, and Theme 12 merge."
intent:
  question: "Does merged main reproduce key Patch/Jungle, lineage, Theme 5, and Theme 12 signals directionally?"
  axes:
    - scenario:
        - r1_00_flat_baseline
        - r1_01_patch_observed
        - r1_02_default_full_jungle
        - r1_03_tuned_full_jungle_recovery
        - r1_04_theme12_clean_pressure_reference
matrix_order:
  - scenario
  - seed
