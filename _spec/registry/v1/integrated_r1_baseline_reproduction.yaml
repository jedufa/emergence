    - "8"
  - - --steps
    - "60"
  - - --pop
    - "48"
  - - --grid_size
    - "16"
  - - --policy_tick_stride
    - "1"
  - - --device
    - cpu
  - - --bank_device
    - cpu
  - - --knob
    - sim_cfg.behavior_log_enable=false
  - - --knob
    - sim_cfg.checkpoint_bundle_v2_period_gen=0
  - - --knob
    - sim_cfg.phase_e_e1_enable=false
  - - --knob
    - sim_cfg.enable_developmental_cognition=false
  - - --knob
