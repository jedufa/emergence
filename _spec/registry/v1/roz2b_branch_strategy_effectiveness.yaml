    - arm_baseline__context_patch_observed_control
    - arm_reporting_only__context_patch_observed_control
    - arm_active_roz2a__context_patch_observed_control
    - arm_baseline__context_roz2a_niche_context
    - arm_reporting_only__context_roz2a_niche_context
    - arm_active_roz2a__context_roz2a_niche_context
    flags:
      arm_baseline__context_true_flat_noop: *baseline_true_flat
      arm_reporting_only__context_true_flat_noop: *reporting_true_flat
      arm_active_roz2a__context_true_flat_noop: *reporting_true_flat
      arm_baseline__context_patch_observed_control: *baseline_patch_observed
      arm_reporting_only__context_patch_observed_control: *reporting_patch_observed
      arm_active_roz2a__context_patch_observed_control: *active_patch_observed
      arm_baseline__context_roz2a_niche_context: *baseline_niche
      arm_reporting_only__context_roz2a_niche_context: *reporting_niche
      arm_active_roz2a__context_roz2a_niche_context: *active_niche
  init_arm:
    values:
    - legacy
    - founder_balanced
    flags:
      legacy:
      - --knob
      - sim_cfg.lineage_founder_balance_enable=false
      founder_balanced:
      - --knob
      - sim_cfg.lineage_founder_balance_enable=true
      - --knob
      - sim_cfg.lineage_founder_group_count=8
      - --knob
      - sim_cfg.lineage_founder_min_agents_per_group=8
      - --knob
      - sim_cfg.lineage_founder_assignment_mode=deterministic_round_robin
      - --knob
      - sim_cfg.lineage_founder_balance_schema_version=1
