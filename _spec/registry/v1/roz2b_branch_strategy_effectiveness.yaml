harness_api: 1
version: 1
name: roz2b_branch_strategy_effectiveness
description: ROZ-2B paired branch and strategy effectiveness matrix with explicit true-flat no-op controls.
intent:
  question: Does default-off ROZ-2A improve population-normalized descendant branch persistence and reproducing ecological strategy divergence relative to matched controls?
  safe_claim_boundary: Bounded branch-aware effectiveness decision only; no intelligence, emergence, cognition, solved lineage diversity, adaptive memory, prediction selection, or open-endedness claim.
matrix_order:
- setting
- init_arm
- seed
