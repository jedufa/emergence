harness_api: 1
version: 1
name: mem1_drh0_pf1_tiny_policy_active_memory_preflight
description: MEM1-DRH0-PF1 tiny policy-active memory preflight.
intent: Bounded preflight only; compares memory_normal versus memory_ablated under tiny DRH0 live-policy execution with controls.
matrix_order:
- trait_arm
- geometry_case
- seed
axes:
  trait_arm:
    values:
    - memory_normal
    - memory_ablated
    flags:
      memory_normal:
      - --knob
      - sim_cfg.force_memory_disabled=false
      - --knob
      - sim_cfg.reset_memory_each_tick=false
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=drh0_delayed_refuge_preflight
      - --knob
      - sim_cfg.force_prediction_zero_lr=false
      - --knob
      - sim_cfg.reset_prediction_each_tick=false
      - --knob
      - sim_cfg.prediction_pressure_scenario=false
      memory_ablated:
      - --knob
      - sim_cfg.force_memory_disabled=true
      - --knob
      - sim_cfg.reset_memory_each_tick=true
      - --knob
      - sim_cfg.memory_pressure_scenario=true
      - --knob
      - sim_cfg.memory_pressure_type=drh0_delayed_refuge_preflight
      - --knob
      - sim_cfg.force_prediction_zero_lr=false
      - --knob
      - sim_cfg.reset_prediction_each_tick=false
      - --knob
      - sim_cfg.prediction_pressure_scenario=false
  geometry_case:
    values:
    - reference_full
    - reference_cue_off_control
    - reference_observation_off_control
    flags:
      reference_full:
      - --knob
      - env_cfg.path1_drh0_reporting_enable=true
      - --knob
      - env_cfg.path1_drh0_consequence_enable=true
      - --knob
      - env_cfg.path1_drh0_refuge_damage_reduction_enable=true
      - --knob
      - env_cfg.path1_drh0_observation_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_observation_enable=true
      reference_cue_off_control:
      - --knob
      - env_cfg.path1_drh0_reporting_enable=true
      - --knob
      - env_cfg.path1_drh0_consequence_enable=true
      - --knob
      - env_cfg.path1_drh0_refuge_damage_reduction_enable=true
      - --knob
      - env_cfg.path1_drh0_observation_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_observation_enable=true
      - --knob
      - env_cfg.wdl_delayed_hazard_cue_enable=false
      reference_observation_off_control:
      - --knob
      - env_cfg.path1_drh0_reporting_enable=true
      - --knob
      - env_cfg.path1_drh0_consequence_enable=true
      - --knob
      - env_cfg.path1_drh0_refuge_damage_reduction_enable=true
      - --knob
      - env_cfg.path1_drh0_observation_enable=false
      - --knob
      - env_cfg.wdl_delayed_hazard_observation_enable=false
seeds:
- 101
- 202
- 303
cli_defaults:
- - --generations
  - "4"
- - --steps
  - "3"
- - --pop
  - "4"
- - --grid_size
  - "5"
- - --device
  - cpu
- - --bank_device
  - cpu
- - --knob
  - env_cfg.patch_world_enable=true
- - --knob
  - env_cfg.patch_world_observation_enable=true
- - --knob
  - env_cfg.enable_biomes=false
- - --knob
  - env_cfg.food_spawn_per_step=0
- - --knob
  - env_cfg.max_food=0
- - --knob
  - env_cfg.patch_cover_default=1.0
- - --knob
  - env_cfg.patch_shelter_default=1.0
- - --knob
  - env_cfg.wdl_delayed_hazard_enable=true
- - --knob
  - env_cfg.wdl_delayed_hazard_damage_enable=true
- - --knob
  - env_cfg.wdl_delayed_hazard_delay_steps=2
- - --knob
  - env_cfg.wdl_delayed_hazard_cue_duration_steps=1
- - --knob
  - env_cfg.wdl_delayed_hazard_active_duration_steps=1
- - --knob
  - env_cfg.wdl_delayed_hazard_event_period_steps=6
- - --knob
  - env_cfg.wdl_delayed_hazard_radius=0
- - --knob
  - env_cfg.wdl_delayed_hazard_intensity=0.4
- - --knob
  - env_cfg.path1_drh0_refuge_reachability_enable=true
- - --knob
  - env_cfg.path1_drh0_refuge_radius=3
- - --knob
  - env_cfg.path1_drh0_refuge_requires_shelter_or_cover=true
- - --knob
  - env_cfg.path1_drh0_min_refuge_cells=1
- - --knob
  - env_cfg.path1_drh0_cue_required_for_refuge_protection=true
- - --knob
  - env_cfg.path1_drh0_pre_arrival_required_for_refuge_protection=true
- - --knob
  - env_cfg.path1_drh0_damage_reduction_fraction=0.5
- - --knob
  - env_cfg.path1_drh0_damage_reduction_cap=1.0
- - --knob
  - sim_cfg.enable_cognitive_trait_registry=true
- - --knob
  - sim_cfg.enable_cognitive_status_metrics=true
- - --knob
  - sim_cfg.enable_cognitive_budget_ledger=false
- - --knob
  - sim_cfg.policy_deterministic_actions=true
- - --knob
  - sim_cfg.behavior_log_enable=false
- - --knob
  - sim_cfg.checkpoint_bundle_v2_period_gen=0
- - --knob
  - sim_cfg.lineage_qd_archive_enable=false
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: mem1_drh0_pf1_tiny_policy_active_memory_preflight
  run_id_format: mem1_drh0_pf1__trait_{trait_arm}__geometry_{geometry_case}__seed{seed:06d}
  run_tag_format: mem1_drh0_pf1__trait_{trait_arm}__geometry_{geometry_case}
mem1_drh0_pf1_live_geometry:
  schema_version: mem1_drh0_pf1_live_geometry_v1
  grid:
    width: 5
    height: 5
  horizon:
    generations: 4
    steps_per_generation: 3
  note: Live policy-active runs use the existing deterministic WDL scheduler; RP2 exact coordinate geometry remains fixture metadata and is not injected into policy-active mechanics.
  cases:
    reference_full:
      family: baseline_reachable_reference
      role: full
      cue_present: true
      observation_enabled: true
      consequence_enabled: true
      refuge_present: true
      static_refuge_control: false
      cue_duration_steps: 1
      hidden_window_steps: 1
      active_duration_steps: 1
      timer_value: 2
      expected_reachable: true
    reference_cue_off_control:
      family: baseline_reachable_reference
      role: cue_off_control
      cue_present: false
      observation_enabled: true
      consequence_enabled: true
      refuge_present: true
      static_refuge_control: false
      cue_duration_steps: 0
      hidden_window_steps: 0
      active_duration_steps: 1
      timer_value: 2
      expected_reachable: false
    reference_observation_off_control:
      family: baseline_reachable_reference
      role: observation_off_control
      cue_present: true
      observation_enabled: false
      consequence_enabled: true
      refuge_present: true
      static_refuge_control: false
      cue_duration_steps: 1
      hidden_window_steps: 1
      active_duration_steps: 1
      timer_value: 2
      expected_reachable: true
