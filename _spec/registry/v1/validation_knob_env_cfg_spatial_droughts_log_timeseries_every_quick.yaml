harness_api: 1
version: 1
name: validation_knob_env_cfg_spatial_droughts_log_timeseries_every_quick
description: Per-knob A/B validation for env_cfg.spatial_droughts_log_timeseries_every.
  Baseline vs variant differ only by this knob (or required enabling context).
intent:
  question: Is knob env_cfg.spatial_droughts_log_timeseries_every traceably applied
    (config + required artifacts) in an A/B run pair?
  axes:
  - ab
matrix_order:
- ab
- seed
axes:
  ab:
    values:
    - baseline
    - variant
    flags:
      baseline:
      - --spatial_droughts_enable
      - --spatial_droughts_spec
      - '@experiments/assets/spatial_droughts/v1/drought_spec__explicit_one_region.json'
      - --spatial_ecology_enable
      - --spatial_ecology_seed
      - '123'
      - --spatial_ecology_log_formats
      - npy
      - --resource_regrowth_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json'
      - --resource_spawn_density_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json'
      - --hazard_rate_map_spec
      - '@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json'
      - --spatial_droughts_log_timeseries_every
      - '10'
      variant:
      - --spatial_droughts_enable
      - --spatial_droughts_spec
      - '@experiments/assets/spatial_droughts/v1/drought_spec__explicit_one_region.json'
      - --spatial_ecology_enable
      - --spatial_ecology_seed
      - '123'
      - --spatial_ecology_log_formats
      - npy
      - --resource_regrowth_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json'
      - --resource_spawn_density_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json'
      - --hazard_rate_map_spec
      - '@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json'
      - --spatial_droughts_log_timeseries_every
      - '1'
seeds:
- 1
cli_defaults:
- - --generations
  - '1'
- - --steps
  - '150'
- - --policy_tick_stride
  - '2'
- - --pop
  - '64'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
- droughts/drought_intensity_timeseries.csv
naming:
  run_tag_prefix: valknob_quick
  run_id_format: validation_knob_env_cfg_spatial_droughts_log_timeseries_every_quick__ab_{ab}__seed{seed:06d}
  run_tag_format: valknob_quick__ab_{ab}
