harness_api: 1
version: 1
name: memory_robustness_delayed_hazard_variants
description: Memory robustness battery across delayed-hazard world/demand loop variants.
intent:
  question: Does the bounded memory-normal advantage survive delayed-hazard world/demand loop variants across tuned Jungle and clean ecology helper substrates?
  note: Bounded memory robustness battery only; no intelligence, emergence, consciousness, adaptive memory, prediction-selection, or general cognition claims.
  planned_runs: 336
  axes:
  - trait_arm:
    - memory_normal
    - memory_ablated
  - substrate_arm:
    - tuned_jungle
    - clean_ecology_helper
  - hazard_context:
    - matched_no_delayed_hazard_baseline
    - reference_delayed_hazard
    - lower_damage_delayed_hazard
    - higher_damage_delayed_hazard
    - shorter_delay_delayed_hazard
    - longer_delay_delayed_hazard
    - noisy_cue_delayed_hazard
  - init_arm:
    - init_legacy
    - init_founder_balanced
matrix_order:
- trait_arm
- substrate_arm
- hazard_context
- init_arm
- seed
