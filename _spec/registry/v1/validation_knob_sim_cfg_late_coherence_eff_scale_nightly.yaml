harness_api: 1
version: 1
name: validation_knob_sim_cfg_late_coherence_eff_scale_nightly
description: Per-knob A/B validation for sim_cfg.late_coherence_eff_scale. Baseline vs variant
  differ only by this knob (or required enabling context).
intent:
  question: Is knob sim_cfg.late_coherence_eff_scale traceably applied (config + required
    artifacts) in an A/B run pair?
  axes:
  - ab
matrix_order:
- ab
- seed
axes:
  ab:
    values:
    - baseline
    - variant
    flags:
      baseline: []
      variant:
      - --late_coherence_eff_scale
      - '7.6'
seeds:
- 1
- 2
- 3
cli_defaults:
- - --generations
  - '200'
- - --steps
  - '150'
- - --policy_tick_stride
  - '2'
- - --pop
  - '256'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: valknob_nightly
  run_id_format: validation_knob_sim_cfg_late_coherence_eff_scale_nightly__ab_{ab}__seed{seed:06d}
  run_tag_format: valknob_nightly__ab_{ab}
