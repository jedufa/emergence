harness_api: 1
version: 1
name: exploration_chaos_week_nightly
description: 'Chaos Week follow-up pack (nightly). Longer horizon, more seeds. Each experiment is A/B (baseline vs variant)
  with exactly 1 primary + 1 helper knob. NOTE: Removed ''late_energy_tax_strong'' (population collapse in quick) and ''policy_stride_1''
  (early-life acceleration confound).'
intent:
  question: Where does the weirdness live? Map which pressures move (or fail to move) population dynamics, timing, and late-life
    signals under tightly controlled 1-primary + 1-helper perturbations.
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - nightly_episode0_miswire_variant__baseline
    - nightly_episode0_miswire_variant__variant
    - nightly_episode0_miswire_ablation__baseline
    - nightly_episode0_miswire_ablation__variant
    - nightly_remove_episode0_weighting__baseline
    - nightly_remove_episode0_weighting__variant
    - nightly_late_energy_tax_mid__baseline
    - nightly_late_energy_tax_mid__variant
    - nightly_policy_stride_4__baseline
    - nightly_policy_stride_4__variant
    - nightly_stride_control_temperature_only__baseline
    - nightly_stride_control_temperature_only__variant
    - nightly_identity_drift__baseline
    - nightly_identity_drift__variant
    flags:
      nightly_episode0_miswire_variant__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_episode0_miswire_variant__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.episode0_pred_err_weight=2.0
      - --knob
      - sim_cfg.episode0_pred_err_fitness_weight=2.0
      nightly_episode0_miswire_ablation__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_episode0_miswire_ablation__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.episode0_pred_err_weight=0.0
      - --knob
      - sim_cfg.episode0_pred_err_fitness_weight=0.0
      nightly_remove_episode0_weighting__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_remove_episode0_weighting__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.episode0_fitness_weight=0.0
      - --knob
      - sim_cfg.episode0_pred_err_weight=1.0
      nightly_late_energy_tax_mid__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_late_energy_tax_mid__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.late_pred_energy_tax_enable=true
      - --knob
      - sim_cfg.late_pred_energy_tax_weight=1.25
      nightly_policy_stride_4__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_policy_stride_4__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.policy_tick_stride=4
      - --knob
      - genome.action_temperature=1.15
      nightly_stride_control_temperature_only__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_stride_control_temperature_only__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.policy_tick_stride=2
      - --knob
      - genome.action_temperature=1.15
      nightly_identity_drift__baseline:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      nightly_identity_drift__variant:
      - --knob
      - sim_cfg.epi_enable=true
      - --knob
      - sim_cfg.epi_print_each_gen=true
      - --knob
      - sim_cfg.epi_timeseries_enable=true
      - --knob
      - sim_cfg.identity_drift_enable=true
      - --knob
      - sim_cfg.identity_drift_strength=1.0
seeds:
- 1
- 2 
- 3
cli_defaults:
- - --generations
  - '1500'
- - --steps
  - '150'
- - --pop
  - '64'
- - --policy_tick_stride
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: chaos_week_nightly
  run_id_format: exploration_chaos_week_nightly__{case}__seed{seed:06d}
  run_tag_format: chaos_week_nightly__{case}
