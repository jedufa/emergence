harness_api: 1
version: 1
name: patch_jungle_v0_campaign_c2_waste
description: 'Campaign C2 waste/crowding consequence sweep: low, medium, and high bounded regrowth-suppression bundles.'
intent:
  question: 'Campaign C2 waste/crowding consequence sweep: low, medium, and high bounded regrowth-suppression bundles.'
  axes:
  - variant:
    - waste_low
    - waste_medium
    - waste_high
  - scenario: &id001
    - s04_patch_waste_crowding
    - s08_full_jungle_no_recovery
    - s09_full_jungle_recovery
matrix_order:
- variant
- scenario
- seed
axes:
  variant:
    values:
    - waste_low
    - waste_medium
    - waste_high
    flags:
      waste_low:
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_scale=0.25
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_max=0.25
      - --knob
      - env_cfg.patch_density_regrowth_penalty_scale=0.25
      - --knob
      - env_cfg.patch_density_regrowth_penalty_max=0.25
      - --knob
      - env_cfg.patch_regrowth_min_multiplier=0.25
      waste_medium:
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_scale=0.5
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_max=0.5
      - --knob
      - env_cfg.patch_density_regrowth_penalty_scale=0.5
      - --knob
      - env_cfg.patch_density_regrowth_penalty_max=0.5
      - --knob
      - env_cfg.patch_regrowth_min_multiplier=0.1
      waste_high:
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_scale=0.75
      - --knob
      - env_cfg.patch_waste_regrowth_penalty_max=0.75
      - --knob
      - env_cfg.patch_density_regrowth_penalty_scale=0.75
      - --knob
      - env_cfg.patch_density_regrowth_penalty_max=0.75
      - --knob
      - env_cfg.patch_regrowth_min_multiplier=0.05
  scenario:
    values: *id001
    flags:
      s04_patch_waste_crowding:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=false
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=false
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=false
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=false
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      s08_full_jungle_no_recovery:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=true
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=true
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=false
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
      s09_full_jungle_recovery:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=true
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=true
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=true
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
seeds:
- 101
- 202
- 303
- 404
- 505
- 606
- 707
- 808
- 909
- 1001
cli_defaults:
- - --generations
  - '10'
- - --steps
  - '80'
- - --pop
  - '32'
- - --grid_size
  - '12'
- - --policy_tick_stride
  - '1'
- - --device
  - cpu
- - --bank_device
  - cpu
- - --knob
  - sim_cfg.behavior_log_enable=false
- - --knob
  - sim_cfg.checkpoint_bundle_v2_period_gen=0
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: patch_jungle_v0_campaign_c2_waste
  run_id_format: '{name}__variant_{variant}__scenario_{scenario}__seed{seed:06d}'
  run_tag_format: '{run_tag_prefix}__variant_{variant}__scenario_{scenario}'
