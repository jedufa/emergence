harness_api: 1
version: 1
name: chaos_week_2_nightly
description: 'Chaos Week 2 (nightly): full pressure topology mapping set. Longer horizon,
  5 seeds. Includes 3 targeted ablations (A4/B3/C2).'
intent:
  question: Pressure topology mapping for Chaos Week 2 (identity coupling, late-life
    pressure, developmental lock-in).
  axes:
  - case
matrix_order:
- case
- seed
axes:
  case:
    values:
    - nightly_A1_identity_gate_soft_action_noise__baseline
    - nightly_A1_identity_gate_soft_action_noise__variant
    - nightly_A2_identity_gate_soft_perception_blur__baseline
    - nightly_A2_identity_gate_soft_perception_blur__variant
    - nightly_A3_identity_gate_moderate_nav_disable__baseline
    - nightly_A3_identity_gate_moderate_nav_disable__variant
    - nightly_A4_identity_gate_moderate_resource_lockout__baseline
    - nightly_A4_identity_gate_moderate_resource_lockout__variant
    - nightly_A4_identity_gate_moderate_resource_lockout_ablation__baseline
    - nightly_A4_identity_gate_moderate_resource_lockout_ablation__variant
    - nightly_A5_identity_gate_hard_capability_off__baseline
    - nightly_A5_identity_gate_hard_capability_off__variant
    - nightly_B1_late_life_hazard_mild__baseline
    - nightly_B1_late_life_hazard_mild__variant
    - nightly_B2_late_life_hazard_moderate__baseline
    - nightly_B2_late_life_hazard_moderate__variant
    - nightly_B3_late_life_resource_access_tax__baseline
    - nightly_B3_late_life_resource_access_tax__variant
    - nightly_B3_late_life_resource_access_tax_ablation__baseline
    - nightly_B3_late_life_resource_access_tax_ablation__variant
    - nightly_B4_late_life_metabolic_cost__baseline
    - nightly_B4_late_life_metabolic_cost__variant
    - nightly_B5_late_life_influence_constraint__baseline
    - nightly_B5_late_life_influence_constraint__variant
    - nightly_C1_plasticity_decay_soft__baseline
    - nightly_C1_plasticity_decay_soft__variant
    - nightly_C2_commitment_lock_mid__baseline
    - nightly_C2_commitment_lock_mid__variant
    - nightly_C2_commitment_lock_mid_ablation__baseline
    - nightly_C2_commitment_lock_mid_ablation__variant
    - nightly_C3_juvenile_fast_mode_late_fragility__baseline
    - nightly_C3_juvenile_fast_mode_late_fragility__variant
    - nightly_C4_no_adult_recovery__baseline
    - nightly_C4_no_adult_recovery__variant
    flags:
      nightly_A1_identity_gate_soft_action_noise__baseline: []
      nightly_A1_identity_gate_soft_action_noise__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=action_noise
      - --knob
      - sim_cfg.identity_gate_strength=0.5
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_A2_identity_gate_soft_perception_blur__baseline: []
      nightly_A2_identity_gate_soft_perception_blur__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=perception_blur
      - --knob
      - sim_cfg.identity_gate_strength=0.5
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_A3_identity_gate_moderate_nav_disable__baseline: []
      nightly_A3_identity_gate_moderate_nav_disable__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=nav_disable_windows
      - --knob
      - sim_cfg.identity_gate_strength=1.0
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_A4_identity_gate_moderate_resource_lockout__baseline: []
      nightly_A4_identity_gate_moderate_resource_lockout__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=resource_lockout
      - --knob
      - sim_cfg.identity_gate_strength=1.0
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_A4_identity_gate_moderate_resource_lockout_ablation__baseline: []
      nightly_A4_identity_gate_moderate_resource_lockout_ablation__variant:
      - --knob
      - sim_cfg.identity_gate_enable=false
      - --knob
      - sim_cfg.identity_gate_mode=resource_lockout
      - --knob
      - sim_cfg.identity_gate_strength=1.0
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_A5_identity_gate_hard_capability_off__baseline: []
      nightly_A5_identity_gate_hard_capability_off__variant:
      - --knob
      - sim_cfg.identity_gate_enable=true
      - --knob
      - sim_cfg.identity_gate_mode=capability_off
      - --knob
      - sim_cfg.identity_gate_strength=1.5
      - --knob
      - sim_cfg.identity_gate_adult_only=true
      nightly_B1_late_life_hazard_mild__baseline: []
      nightly_B1_late_life_hazard_mild__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=hazard
      - --knob
      - sim_cfg.late_life_pressure_weight=0.5
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_B2_late_life_hazard_moderate__baseline: []
      nightly_B2_late_life_hazard_moderate__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=hazard
      - --knob
      - sim_cfg.late_life_pressure_weight=1.0
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_B3_late_life_resource_access_tax__baseline: []
      nightly_B3_late_life_resource_access_tax__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=resource_access_tax
      - --knob
      - sim_cfg.late_life_pressure_weight=1.25
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_B3_late_life_resource_access_tax_ablation__baseline: []
      nightly_B3_late_life_resource_access_tax_ablation__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=false
      - --knob
      - sim_cfg.late_life_pressure_type=resource_access_tax
      - --knob
      - sim_cfg.late_life_pressure_weight=1.25
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_B4_late_life_metabolic_cost__baseline: []
      nightly_B4_late_life_metabolic_cost__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=metabolic_cost
      - --knob
      - sim_cfg.late_life_pressure_weight=1.25
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_B5_late_life_influence_constraint__baseline: []
      nightly_B5_late_life_influence_constraint__variant:
      - --knob
      - sim_cfg.late_life_pressure_enable=true
      - --knob
      - sim_cfg.late_life_pressure_type=influence_constraint
      - --knob
      - sim_cfg.late_life_pressure_weight=1.0
      - --knob
      - sim_cfg.late_life_start_age_frac=0.66
      nightly_C1_plasticity_decay_soft__baseline: []
      nightly_C1_plasticity_decay_soft__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=true
      - --knob
      - sim_cfg.dev_plasticity_decay_enable=true
      - --knob
      - sim_cfg.dev_plasticity_half_life_steps=60
      nightly_C2_commitment_lock_mid__baseline: []
      nightly_C2_commitment_lock_mid__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=true
      - --knob
      - sim_cfg.dev_commitment_enable=true
      - --knob
      - sim_cfg.dev_commit_age_frac=0.25
      nightly_C2_commitment_lock_mid_ablation__baseline: []
      nightly_C2_commitment_lock_mid_ablation__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=false
      - --knob
      - sim_cfg.dev_commitment_enable=true
      - --knob
      - sim_cfg.dev_commit_age_frac=0.25
      nightly_C3_juvenile_fast_mode_late_fragility__baseline: []
      nightly_C3_juvenile_fast_mode_late_fragility__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=true
      - --knob
      - sim_cfg.dev_fragility_enable=true
      - --knob
      - sim_cfg.dev_fragility_strength=1.25
      - --knob
      - sim_cfg.dev_fragility_accumulates_in_juvenile=true
      nightly_C4_no_adult_recovery__baseline: []
      nightly_C4_no_adult_recovery__variant:
      - --knob
      - sim_cfg.dev_lockin_enable=true
      - --knob
      - sim_cfg.dev_no_adult_recovery_enable=true
      - --knob
      - sim_cfg.dev_no_adult_recovery_start_age_frac=0.66
seeds:
- 1
- 2
- 3
- 4
- 5
cli_defaults:
- - --generations
  - '300'
- - --steps
  - '150'
- - --pop
  - '256'
- - --policy_tick_stride
  - '2'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
- behaviors.csv
naming:
  run_tag_prefix: chaos_week2_nightly
  run_id_format: chaos_week_2_nightly__{case}__seed{seed:06d}
  run_tag_format: chaos_week2_nightly__{case}
