harness_api: 1
version: 1
name: validation_knob_env_cfg_spatial_ecology_log_formats_quick
description: Per-knob A/B validation for env_cfg.spatial_ecology_log_formats. Baseline
  vs variant differ only by this knob (or required enabling context).
intent:
  question: Is knob env_cfg.spatial_ecology_log_formats traceably applied (config
    + required artifacts) in an A/B run pair?
  axes:
  - ab
matrix_order:
- ab
- seed
axes:
  ab:
    values:
    - baseline
    - variant
    flags:
      baseline:
      - --spatial_ecology_enable
      - --spatial_ecology_seed
      - '123'
      - --resource_regrowth_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json'
      - --resource_spawn_density_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json'
      - --hazard_rate_map_spec
      - '@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json'
      - --spatial_ecology_log_formats
      - npy
      variant:
      - --spatial_ecology_enable
      - --spatial_ecology_seed
      - '123'
      - --resource_regrowth_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_regrowth_map__uniform.json'
      - --resource_spawn_density_map_spec
      - '@experiments/assets/spatial_ecology/v1/resource_spawn_density_map__uniform.json'
      - --hazard_rate_map_spec
      - '@experiments/assets/spatial_ecology/v1/hazard_rate_map__uniform.json'
      - --spatial_ecology_log_formats
      - npy,png
seeds:
- 1
cli_defaults:
- - --generations
  - '1'
- - --steps
  - '150'
- - --policy_tick_stride
  - '2'
- - --pop
  - '64'
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
- maps/resource_spawn_density_map.png
naming:
  run_tag_prefix: valknob_quick
  run_id_format: validation_knob_env_cfg_spatial_ecology_log_formats_quick__ab_{ab}__seed{seed:06d}
  run_tag_format: valknob_quick__ab_{ab}
