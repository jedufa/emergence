naming:
  run_tag_prefix: phaseIV_crb_m1_memory_readiness_bridge
  run_id_format: "phaseIV_crb_m1_memory_readiness_bridge__ecology_{ecology_context}__init_{init_arm}__memory_{memory_condition}__seed{seed:06d}"
  run_tag_format: "phaseIV_crb_m1_memory_readiness_bridge__ecology_{ecology_context}__init_{init_arm}__memory_{memory_condition}"
