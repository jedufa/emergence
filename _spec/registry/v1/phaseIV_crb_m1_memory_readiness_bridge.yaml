harness_api: 1
version: 1
name: phaseIV_crb_m1_memory_readiness_bridge
description: "Phase IV CRB-M1 memory readiness bridge with ecology, founder-init, and memory-ablation arms."
intent:
  question: "Does memory-normal machinery produce a stronger, reproducible, pressure-specific selection signal than memory-ablated machinery over a longer campaign?"
  axes:
    - ecology_context:
        - crbm1_flat_control_clean
        - crbm1_tuned_full_jungle_recovery
        - crbm1_theme12_clean_pressure
    - init_arm:
        - init_legacy
        - init_founder_balanced
    - memory_condition:
        - memory_normal
        - memory_ablated
matrix_order:
  - ecology_context
  - init_arm
  - memory_condition
  - seed
axes:
  ecology_context:
    values:
      - crbm1_flat_control_clean
      - crbm1_tuned_full_jungle_recovery
      - crbm1_theme12_clean_pressure
    flags:
      crbm1_flat_control_clean:
        - --knob
        - env_cfg.patch_world_enable=false
        - --knob
        - env_cfg.patch_world_observation_enable=false
        - --knob
        - env_cfg.patch_world_waste_consequence_enable=false
        - --knob
        - env_cfg.jungle_predator_pressure_enable=false
        - --knob
        - env_cfg.jungle_reproduction_emissions_enable=false
        - --knob
        - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
        - --knob
        - env_cfg.jungle_terrain_protection_enable=false
        - --knob
        - env_cfg.jungle_ecological_recovery_enable=false
        - --knob
        - env_cfg.patch_movement_cost_apply_enable=false
      crbm1_tuned_full_jungle_recovery:
        - --knob
        - env_cfg.patch_world_enable=true
        - --knob
        - env_cfg.patch_world_observation_enable=true
        - --knob
        - env_cfg.patch_world_waste_consequence_enable=true
        - --knob
        - env_cfg.jungle_predator_pressure_enable=true
        - --knob
        - env_cfg.jungle_reproduction_emissions_enable=true
        - --knob
        - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
        - --knob
        - env_cfg.jungle_terrain_protection_enable=true
        - --knob
        - env_cfg.jungle_ecological_recovery_enable=true
        - --knob
        - env_cfg.patch_movement_cost_apply_enable=false
        - --knob
        - env_cfg.patch_cover_default=0.25
        - --knob
        - env_cfg.patch_shelter_default=0.15
        - --knob
        - env_cfg.patch_shelter_from_cover_enable=false
        - --knob
        - env_cfg.jungle_predator_base_risk=0.0
        - --knob
        - env_cfg.jungle_predator_scent_weight=0.02
        - --knob
        - env_cfg.jungle_predator_waste_weight=0.02
        - --knob
        - env_cfg.jungle_predator_density_weight=0.02
        - --knob
        - env_cfg.jungle_predator_visibility_weight=0.02
        - --knob
        - env_cfg.jungle_predator_risk_cap=0.05
        - --knob
        - env_cfg.jungle_predator_health_damage=0.25
        - --knob
        - env_cfg.patch_waste_regrowth_penalty_scale=0.5
        - --knob
        - env_cfg.patch_waste_regrowth_penalty_max=0.5
        - --knob
        - env_cfg.patch_density_regrowth_penalty_scale=0.5
        - --knob
        - env_cfg.patch_density_regrowth_penalty_max=0.5
        - --knob
        - env_cfg.patch_regrowth_min_multiplier=0.1
        - --knob
        - env_cfg.jungle_cover_damage_reduction_weight=0.4
        - --knob
        - env_cfg.jungle_shelter_damage_reduction_weight=0.4
        - --knob
        - env_cfg.jungle_terrain_damage_multiplier_min=0.15
        - --knob
        - env_cfg.jungle_recovery_regrowth_boost_scale=0.05
        - --knob
        - env_cfg.jungle_recovery_regrowth_boost_max=0.1
        - --knob
        - env_cfg.jungle_recovery_fertility_enable=false
        - --knob
        - env_cfg.jungle_resource_spread_enable=false
      crbm1_theme12_clean_pressure:
        - --knob
        - env_cfg.patch_world_enable=true
        - --knob
        - env_cfg.patch_world_observation_enable=true
        - --knob
        - env_cfg.patch_world_waste_consequence_enable=true
        - --knob
        - env_cfg.jungle_predator_pressure_enable=true
        - --knob
        - env_cfg.jungle_reproduction_emissions_enable=true
        - --knob
        - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
        - --knob
        - env_cfg.jungle_terrain_protection_enable=true
        - --knob
        - env_cfg.jungle_ecological_recovery_enable=true
        - --knob
        - env_cfg.patch_movement_cost_apply_enable=false
        - --knob
        - env_cfg.patch_cover_default=0.25
        - --knob
        - env_cfg.patch_shelter_default=0.15
        - --knob
        - env_cfg.patch_shelter_from_cover_enable=false
        - --knob
        - env_cfg.patch_waste_regrowth_penalty_scale=0.35
        - --knob
        - env_cfg.patch_density_regrowth_penalty_scale=0.35
        - --knob
        - env_cfg.jungle_predator_risk_cap=0.045
        - --knob
        - env_cfg.jungle_predator_health_damage=0.22
        - --knob
        - env_cfg.jungle_recovery_regrowth_boost_scale=0.08
  init_arm:
    values:
      - init_legacy
      - init_founder_balanced
    flags:
      init_legacy:
        - --knob
        - sim_cfg.lineage_founder_balance_enable=false
      init_founder_balanced:
        - --knob
        - sim_cfg.lineage_founder_balance_enable=true
        - --knob
        - sim_cfg.lineage_founder_group_count=8
        - --knob
        - sim_cfg.lineage_founder_min_agents_per_group=8
        - --knob
        - sim_cfg.lineage_founder_assignment_mode=deterministic_round_robin
        - --knob
        - sim_cfg.lineage_founder_balance_schema_version=1
  memory_condition:
    values:
      - memory_normal
      - memory_ablated
    flags:
      memory_normal:
        - --knob
        - sim_cfg.force_memory_disabled=false
        - --knob
        - sim_cfg.reset_memory_each_tick=false
      memory_ablated:
        - --knob
        - sim_cfg.force_memory_disabled=true
        - --knob
        - sim_cfg.reset_memory_each_tick=true
seeds:
  - 101
  - 202
  - 303
  - 404
  - 505
