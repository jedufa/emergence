harness_api: 1
version: 1
name: wdl2_demand_loop_cognition_readiness_bridge
description: "WDL-2 demand-loop cognition readiness bridge for memory and prediction controls."
intent:
  question: "Does the WDL-1 delayed hazard demand loop improve normal-vs-ablated memory or prediction readiness relative to matched WDL-disabled controls?"
  note: "Bridge campaign only; no intelligence, emergence, memory-selection, or prediction-selection claims."
  axes:
    - trait_arm:
        - memory_normal
        - memory_ablated
        - prediction_normal
        - prediction_ablated
    - world_context:
        - wdl2_tuned_jungle_baseline
        - wdl2_tuned_jungle_wdl_enabled
        - wdl2_theme12_clean_baseline
        - wdl2_theme12_clean_wdl_enabled
    - init_arm:
        - init_legacy
        - init_founder_balanced
matrix_order:
  - trait_arm
  - world_context
  - init_arm
  - seed
axes:
  trait_arm:
    values:
      - memory_normal
      - memory_ablated
      - prediction_normal
      - prediction_ablated
    flags:
      memory_normal:
        - --knob
        - sim_cfg.force_memory_disabled=false
        - --knob
        - sim_cfg.reset_memory_each_tick=false
        - --knob
        - sim_cfg.memory_pressure_scenario=true
        - --knob
        - sim_cfg.memory_pressure_type=delayed_hazard_readiness
        - --knob
        - sim_cfg.force_prediction_zero_lr=false
        - --knob
        - sim_cfg.reset_prediction_each_tick=false
        - --knob
        - sim_cfg.prediction_pressure_scenario=false
      memory_ablated:
        - --knob
        - sim_cfg.force_memory_disabled=true
        - --knob
        - sim_cfg.reset_memory_each_tick=true
        - --knob
        - sim_cfg.memory_pressure_scenario=true
        - --knob
        - sim_cfg.memory_pressure_type=delayed_hazard_readiness
        - --knob
        - sim_cfg.force_prediction_zero_lr=false
        - --knob
        - sim_cfg.reset_prediction_each_tick=false
        - --knob
        - sim_cfg.prediction_pressure_scenario=false
      prediction_normal:
        - --knob
        - sim_cfg.force_prediction_zero_lr=false
        - --knob
        - sim_cfg.reset_prediction_each_tick=false
        - --knob
        - sim_cfg.prediction_pressure_scenario=true
        - --knob
        - sim_cfg.prediction_pressure_type=delayed_consequence
        - --knob
        - sim_cfg.force_memory_disabled=false
        - --knob
        - sim_cfg.reset_memory_each_tick=false
        - --knob
        - sim_cfg.memory_pressure_scenario=false
      prediction_ablated:
        - --knob
        - sim_cfg.force_prediction_zero_lr=true
        - --knob
        - sim_cfg.reset_prediction_each_tick=true
        - --knob
        - sim_cfg.prediction_pressure_scenario=true
        - --knob
        - sim_cfg.prediction_pressure_type=delayed_consequence
        - --knob
        - sim_cfg.force_memory_disabled=false
        - --knob
        - sim_cfg.reset_memory_each_tick=false
        - --knob
        - sim_cfg.memory_pressure_scenario=false
