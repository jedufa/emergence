harness_api: 1
version: 1
name: patch_jungle_v0_campaign_c_repeat_preflight
description: Campaign C repeat-parity preflight for s00, s05, and s09 at Campaign C run length.
intent:
  question: Verify same scenario plus same seed repeat parity at Campaign C settings before pressure tuning.
  axes:
  - scenario: &id001
    - s00_flat_baseline
    - s05_predator_pressure
    - s09_full_jungle_recovery
matrix_order:
- scenario
- seed
axes:
  scenario:
    values: *id001
    flags:
      s00_flat_baseline:
      - --knob
      - env_cfg.patch_world_enable=false
      - --knob
      - env_cfg.patch_world_observation_enable=false
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=false
      - --knob
      - env_cfg.jungle_predator_pressure_enable=false
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=false
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=false
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=false
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      s05_predator_pressure:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=false
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=false
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=false
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=false
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
      s09_full_jungle_recovery:
      - --knob
      - env_cfg.patch_world_enable=true
      - --knob
      - env_cfg.patch_world_observation_enable=true
      - --knob
      - env_cfg.patch_world_waste_consequence_enable=true
      - --knob
      - env_cfg.jungle_predator_pressure_enable=true
      - --knob
      - env_cfg.jungle_reproduction_emissions_enable=true
      - --knob
      - env_cfg.jungle_juvenile_predator_vulnerability_enable=false
      - --knob
      - env_cfg.jungle_terrain_protection_enable=true
      - --knob
      - env_cfg.jungle_ecological_recovery_enable=true
      - --knob
      - env_cfg.patch_movement_cost_apply_enable=false
      - --knob
      - env_cfg.patch_cover_default=0.25
      - --knob
      - env_cfg.patch_shelter_default=0.15
      - --knob
      - env_cfg.patch_shelter_from_cover_enable=false
seeds:
- 101
cli_defaults:
- - --generations
  - '10'
- - --steps
  - '80'
- - --pop
  - '32'
- - --grid_size
  - '12'
- - --policy_tick_stride
  - '1'
- - --device
  - cpu
- - --bank_device
  - cpu
- - --knob
  - sim_cfg.behavior_log_enable=false
- - --knob
  - sim_cfg.checkpoint_bundle_v2_period_gen=0
expected_artifacts:
- manifest.json
- run_config.csv
- config.json
- metrics.csv
naming:
  run_tag_prefix: patch_jungle_v0_campaign_c_repeat_preflight
  run_id_format: '{name}__scenario_{scenario}__seed{seed:06d}'
  run_tag_format: '{run_tag_prefix}__scenario_{scenario}'
